<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,700&amp;family=Montserrat:wght@300;400;500&amp;display=swap');
      .title {
        font-family: 'Bodoni Moda', 'Bodoni 72', 'Didot', 'Playfair Display', serif;
        font-size: 150px;
        font-weight: 600;
        fill: #111111;
        letter-spacing: 5px;
        text-anchor: middle;
      }
      .subtitle {
        font-family: 'Montserrat', 'Helvetica Neue', 'Segoe UI', sans-serif;
        font-size: 30px;
        font-weight: 400;
        fill: #111111;
        letter-spacing: 18px;
        text-anchor: middle;
      }
      .divider {
        stroke: #111111;
        stroke-width: 1.5;
        stroke-opacity: 0.25;
      }
    </style>
  </defs>
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <text x="500" y="475" class="title">LUMI</text>
  <line x1="360" y1="515" x2="640" y2="515" class="divider"/>
  <text x="509" y="565" class="subtitle">WELLNESS</text>
</svg>
